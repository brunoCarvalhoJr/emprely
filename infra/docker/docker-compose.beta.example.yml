name: emprely-beta

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-emprely}
      POSTGRES_USER: ${POSTGRES_USER:-emprely}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - emprely-beta-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emprely} -d ${POSTGRES_DB:-emprely}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__EmprelyDb: Host=postgres;Port=5432;Database=${POSTGRES_DB:-emprely};Username=${POSTGRES_USER:-emprely};Password=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      Jwt__Issuer: ${JWT_ISSUER:-Emprely}
      Jwt__Audience: ${JWT_AUDIENCE:-Emprely.Web}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?defina JWT_SIGNING_KEY}
      Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES:-120}
      Cors__OrigensPermitidas__0: ${WEB_PUBLIC_URL:?defina WEB_PUBLIC_URL}
      AdminOperacoes__OperationsKey: ${ADMIN_OPERACOES_KEY:?defina ADMIN_OPERACOES_KEY}
      AdminPainel__OwnerEmail: ${ADMIN_PAINEL_OWNER_EMAIL:?defina ADMIN_PAINEL_OWNER_EMAIL}
      RateLimit__AuthPermitLimit: ${RATE_LIMIT_AUTH_PERMIT_LIMIT:-30}
      RateLimit__AdminPermitLimit: ${RATE_LIMIT_ADMIN_PERMIT_LIMIT:-10}
      RateLimit__WindowSeconds: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        VITE_API_BASE_URL: ${API_PUBLIC_URL:?defina API_PUBLIC_URL}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8081}:8080"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  emprely-beta-postgres-data:
