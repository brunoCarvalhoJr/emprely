services:
  postgres:
    image: postgres:17-alpine
    container_name: emprely-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: emprely
      POSTGRES_USER: emprely
      POSTGRES_PASSWORD: emprely_dev
    ports:
      - "5432:5432"
    volumes:
      - emprely-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emprely -d emprely"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  emprely-postgres-data:
